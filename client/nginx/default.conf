# nginx del frontend: sirve la app React y actúa como reverse proxy hacia los
# demás servicios, de modo que el navegador usa un único origen (una sola URL
# y un solo balanceador). Los nombres backend, socket y ai-service son los
# Services de Kubernetes (o los servicios de docker compose en local).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Igual que spring.servlet.multipart.max-file-size del backend.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health check para las probes de Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API REST (Spring Boot). /api/auth/login → backend:5000/auth/login
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tiempo real (Socket.io con WebSocket).
    location /socket.io/ {
        proxy_pass http://socket:8800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Microservicio de IA (FastAPI). /ai/analyze → ai-service:8000/analyze
    location /ai/ {
        proxy_pass http://ai-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos estáticos con hash en el nombre: caché larga.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta de React devuelve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
