spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/railway}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  devtools:
    restart:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
file:
  upload-dir: src/main/resources/images
server:
  address: 0.0.0.0
  port: 5000
  # Termina las peticiones en curso antes de apagarse (rolling updates sin errores).
  shutdown: graceful

# Health checks para Kubernetes:
#   /actuator/health/liveness  → ¿el proceso está vivo? (si falla, se reinicia)
#   /actuator/health/readiness → ¿puede recibir tráfico? (incluye la base de datos)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
