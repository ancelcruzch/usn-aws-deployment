# Integración continua de la infraestructura: formato, validación y análisis
# estático de Terraform. No necesita credenciales AWS (no ejecuta plan/apply).
name: Terraform CI

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_DIR: infrastructure/terraform
  TF_VERSION: "1.17.1"

jobs:
  lint:
    name: fmt / tflint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt (todos los módulos)
        run: terraform fmt -check -recursive -diff

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint (ambientes, módulos y bootstrap)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Los módulos se validan a través de las capas que los componen.
        dir: ["envs/dev/base", "envs/dev/platform", "bootstrap"]
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  security-scan:
    name: checkov (seguridad IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          # Los hallazgos se publican como reporte; no bloquean mientras se
          # revisan y documentan las excepciones aceptadas para el entorno dev.
          soft_fail: true
          output_format: cli,junitxml
          output_file_path: console,checkov-report

      - name: Publicar reporte checkov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-report
          path: checkov-report
          if-no-files-found: warn
